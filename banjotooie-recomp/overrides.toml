# Manual codegen overrides for Banjo-Tooie (XBLA).

# CRT setjmp/longjmp (found via the D3DX shader-compiler E_FAIL trail, crash #1).
# The recompiled _setjmp (0x8259FD90) was truncated to its 5-instruction hook stub
# (hook at 0x826CCC58 is null at runtime), so it fell off the end returning garbage
# nonzero r3 -> D3DX compiler took its longjmp error path on every compile -> E_FAIL.
# These make codegen replace call sites with host ppc_setjmp/ppc_longjmp.
setjmp_address = 0x8259FD90
longjmp_address = 0x8259FA70
# These 4 tail-call ('b') targets were not auto-detected as function starts
# by the analyzer (UnresolvedCall: "target not in any function"). Declaring
# them as function entry points lets the scanner discover their extents.
[functions]
0x8223F200 = {}
0x8223AC28 = {}
0x82523A78 = {}
0x822E8C00 = {}
# Indirect-call target (crash #2): comparator reached only via function pointer
# from the D3DX shader compiler; scanner missed it (gap 0x82415008..0x824151E4).
0x82415170 = {}
